services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: gridpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gridpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpulse} -d ${POSTGRES_DB:-gridpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Neo4j ────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: gridpulse_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-gridpulse_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:7474/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridpulse_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gridpulse}:${POSTGRES_PASSWORD:-gridpulse_secret}@postgres:5432/${POSTGRES_DB:-gridpulse}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-gridpulse_neo4j}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./seeds:/app/seeds:ro
      - ./src:/app/src
    command: >
      sh -c "
        python -m src.app.database.seed &&
        uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ── Frontend (React/Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridpulse_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
