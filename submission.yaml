submission:
  title: "GridPulse AI - Power Outage & Grid Equipment Failure Advisor" # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Power transformer and substation failures cause blackouts costing utilities upwards of $1M per hour and impacting millions of citizens. Existing operations rely on rigid calendar maintenance schedules while rich sensor telemetry (temperature, vibration, partial discharge, dissolved gas analysis) and incoming severe weather forecasts remain un-correlated in silos, blinding engineers to imminent catastrophic failures.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    GridPulse AI is an intelligent predictive maintenance and outage advisory platform powered by IBM Bob and watsonx.ai. It continuously ingests real-time substation sensor streams and weather alert feeds, evaluates asset health indices (HI) and outage probabilities, ranks equipment by critical grid impact, and automatically generates prioritized mitigation schedules and emergency crew pre-positioning plans.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Multi-modal telemetry ingestion evaluating transformer thermal, vibration, and Dissolved Gas Analysis (DGA) signatures"
    - "Dynamic weather-impact risk fusion correlating severe meteorological storm/heatwave alerts with equipment stress"
    - "Grid impact criticality ranking determining outage contagion and potential downstream customer loss"
    - "AI-driven automated maintenance dispatch and optimal emergency crew pre-positioning strategy"
    - "IBM Bob & watsonx natural language diagnostic Copilot delivering explainable failure root-cause and CAPA runbooks"

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript", "HTML5", "CSS3"]
    frameworks: ["FastAPI", "Uvicorn", "Pydantic", "React", "Vite"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Granite"]
    databases: ["PostgreSQL", "Neo4j", "SQLAlchemy Async"]
    other: ["Docker", "GitHub Actions", "Mermaid.js"]

  what_we_are_most_proud_of: >
    The automated multi-factor risk fusion algorithm that successfully correlates biochemical transformer degradation (DGA / IEEE C57 standards) with real-time extreme weather vectors to generate proactive emergency crew routing hours before physical blackout events occur.

  known_limitations: >
    Live GIS geospatial map layers currently operate with simulated substation distribution coordinates, and SCADA control relays are sandboxed in an advisory simulation mode rather than executing direct physical grid breaker trips.

